spring.application.name=vuelos-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/clubaereo
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Crea o actualiza tablas automáticamente según tus entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# URLs de los otros microservicios
clients.pasajero.url=${PASAJERO_URL:http://localhost:8082}
clients.aeronaves.url=${AERONAVES_URL:http://localhost:8081}
